<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rune Sword — Márk Szabó · 3D Artist</title>
<meta name="description" content="Rune Sword — a game-ready hard surface weapon asset by Márk Szabó.">
<meta name="theme-color" content="#0B0B0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.146 0 0);
  --surface:oklch(0.175 0 0);
  --fg:oklch(0.95 0 0);
  --muted:oklch(0.66 0 0);
  --border:oklch(0.26 0 0);
  --accent:oklch(0.565 0.208 27);
  --accent-soft:oklch(0.68 0.19 27);
  --font-display:"Space Grotesk","Segoe UI",Arial,sans-serif;
  --font-body:"Inter","Segoe UI",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
figure{margin:0}
::selection{background:var(--accent);color:#0b0b0b}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
#contact{scroll-margin-top:96px}

/* ---------- Cinematic page transition ---------- */
@view-transition{navigation:auto}
::view-transition-root{background:oklch(0.146 0 0)}
::view-transition-old(root){animation:vt-out .4s cubic-bezier(.3,.6,.2,1) both}
::view-transition-new(root){animation:vt-in .4s cubic-bezier(.3,.6,.2,1) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-8px) scale(.992)}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px) scale(.992)}}
@media (prefers-reduced-motion:reduce){
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.01ms}
}

.container{max-width:1520px;margin:0 auto;padding:0 clamp(24px,4vw,72px)}

/* ---------- Navigation ---------- */
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.nav-inner{height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.nav-brand{display:flex;align-items:center;gap:14px;padding:6px 0}
.nav-mark{width:9px;height:9px;background:var(--accent);flex:none}
.nav-mark::after{content:"";display:block;width:17px;height:17px;margin:-4px 0 0 -4px;border:1px solid var(--accent);opacity:.45}
.nav-brand-text{display:flex;flex-direction:column;line-height:1.2}
.nav-name{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.045em}
.nav-role{font-family:var(--font-display);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.26em;color:var(--muted);margin-top:2px}
.nav-links{display:flex;align-items:center;gap:clamp(20px,3vw,46px);margin:0 auto}
.nav-link{position:relative;font-family:var(--font-display);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 2px;transition:color .3s cubic-bezier(.2,.65,.2,1)}
.nav-link:hover{color:var(--fg)}
.nav-link.is-active{color:var(--fg);text-shadow:0 0 14px oklch(0.95 0 0 / 0.32)}
.nav-link.is-active::after{content:"";position:absolute;left:2px;right:2px;bottom:4px;height:2px;background:var(--fg)}
.nav-actions{display:flex;align-items:center;gap:2px}
.nav-action{display:grid;place-items:center;width:44px;height:44px;color:var(--muted);border:1px solid transparent;border-radius:2px;transition:color .25s,border-color .25s,background .25s}
.nav-action:hover{color:var(--fg);border-color:var(--border);background:var(--surface)}
.nav-action svg{width:17px;height:17px}

/* ---------- Project header ---------- */
.project-header{padding:108px 0 0}
.project-back{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:48px;transition:color .25s}
.project-back:hover{color:var(--fg)}
.project-back svg{width:15px;height:15px;transition:transform .25s}
.project-back:hover svg{transform:translateX(-3px)}
.project-title{font-family:var(--font-display);font-weight:600;font-size:clamp(46px,6vw,88px);line-height:1.05;letter-spacing:-.03em}
.project-subtitle{font-family:var(--font-display);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.24em;color:var(--muted);margin-top:22px}

/* ---------- Gallery ---------- */
.project-gallery{padding:112px 0 136px}
.gallery-hero{margin-bottom:44px}
.gallery-item img{width:100%;height:auto;border:1px solid var(--border);border-radius:2px;background:var(--surface);transition:filter .3s ease-out}
.gallery-item:hover img{filter:brightness(1.1)}
.gallery-img-btn{display:block;width:100%;padding:0;border:none;background:none;cursor:pointer;border-radius:2px;overflow:hidden}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ---------- Lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:oklch(0.05 0 0 / 0.9);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
.lightbox.is-open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease,visibility 0s}
.lightbox-backdrop{position:absolute;inset:0;width:100%;height:100%;z-index:1;cursor:zoom-out}
.lightbox-stage{position:relative;z-index:2;display:grid;place-items:center}
.lightbox-img{max-width:min(92vw,1500px);max-height:86vh;object-fit:contain;border:1px solid var(--border);border-radius:4px;background:var(--bg);opacity:0;transition:opacity .18s ease,transform .25s ease;transform:scale(.97)}
.lightbox.is-open .lightbox-img{transform:scale(1)}
.lightbox-btn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:48px;height:48px;display:grid;place-items:center;color:var(--fg);border:1px solid var(--border);border-radius:4px;background:oklch(0.12 0 0 / 0.9);transition:border-color .25s,background .25s}
.lightbox-btn:hover{border-color:var(--fg);background:oklch(0.16 0 0 / 0.92)}
.lightbox-btn svg{width:18px;height:18px}
.lightbox-prev{left:22px}
.lightbox-next{right:22px}
.lightbox-close{position:absolute;z-index:3;top:22px;right:22px;width:48px;height:48px;display:grid;place-items:center;color:var(--fg);border:1px solid var(--border);border-radius:4px;background:oklch(0.12 0 0 / 0.9);transition:border-color .25s,background .25s}
.lightbox-close:hover{border-color:var(--fg);background:oklch(0.16 0 0 / 0.92)}
.lightbox-close svg{width:18px;height:18px}
.lightbox-count{position:absolute;z-index:3;right:26px;bottom:22px;font-family:var(--font-display);font-size:12px;font-weight:500;letter-spacing:.18em;color:var(--muted)}

/* ---------- Footer ---------- */
.footer{border-top:1px solid var(--border);padding:26px 0 30px}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.03em;color:var(--muted)}
.footer-inner strong{font-weight:600;color:var(--fg);letter-spacing:.06em}
.footer-tag{font-family:var(--font-display);font-size:10px;text-transform:uppercase;letter-spacing:.24em}

/* ---------- Responsive ---------- */
@media (max-width:1080px){
  .project-header{padding:84px 0 0}
  .project-gallery{padding:92px 0 108px}
}
@media (max-width:680px){
  .nav-inner{height:auto;flex-wrap:wrap;padding:14px 0 12px;row-gap:8px}
  .nav-links{order:3;width:100%;justify-content:center;gap:30px}
  .nav-actions{gap:2px}
  .project-header{padding:64px 0 0}
  .project-back{margin-bottom:34px}
  .project-title{font-size:clamp(40px,12vw,56px);letter-spacing:-.02em}
  .project-gallery{padding:64px 0 84px}
  .gallery-hero{margin-bottom:20px}
  .gallery-grid{grid-template-columns:1fr;gap:20px}
  .lightbox-prev{left:12px}
  .lightbox-next{right:12px}
  .lightbox-close{top:14px;right:12px}
  .lightbox-count{right:16px;bottom:16px}
  .lightbox-img{max-width:90vw;max-height:80vh}
  .footer-inner{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav" data-od-id="nav">
  <div class="container nav-inner">
    <a class="nav-brand" href="index.html" data-od-id="nav-brand">
      <span class="nav-mark" aria-hidden="true"></span>
      <span class="nav-brand-text">
        <span class="nav-name">MÁRK SZABÓ</span>
        <span class="nav-role">3D Artist</span>
      </span>
    </a>
    <div class="nav-links" data-od-id="nav-links">
      <a class="nav-link" href="index.html" data-od-id="nav-link-home">Home</a>
      <a class="nav-link is-active" href="work.html" data-od-id="nav-link-work">Work</a>
      <a class="nav-link" href="index.html#about" data-od-id="nav-link-about">About</a>
      <a class="nav-link" href="contact.html" data-od-id="nav-link-contact">Contact</a>
    </div>
  </div>
</nav>

<!-- Project hero -->
<header class="project-header" data-od-id="project-header">
  <div class="container">
    <a class="project-back" href="work.html" data-od-id="back-to-work">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8H3M7 3.5L2.5 8 7 12.5"/></svg>
      All Projects
    </a>
    <h1 class="project-title" data-od-id="project-title">Rune Sword</h1>
    <p class="project-subtitle" data-od-id="project-subtitle">Game Weapon &nbsp;•&nbsp; Hard Surface &nbsp;•&nbsp; 3D Asset</p>
  </div>
</header>

<!-- Gallery -->
<section class="project-gallery" data-gallery="gallery" data-od-id="gallery">
  <div class="container">

    <figure class="gallery-item gallery-hero" data-od-id="gallery-item-1">
      <button class="gallery-img-btn" type="button" data-lightbox data-src="assets/rune-sword/rune-sword-01.jpg" aria-label="Open Rune Sword render 1">
        <img src="assets/rune-sword/rune-sword-01.jpg" alt="Rune Sword — final presentation render">
      </button>
    </figure>

    <div class="gallery-grid">
      <figure class="gallery-item" data-od-id="gallery-item-2">
        <button class="gallery-img-btn" type="button" data-lightbox data-src="assets/rune-sword/rune-sword-02.jpg" aria-label="Open Rune Sword render 2">
          <img src="assets/rune-sword/rune-sword-02.jpg" alt="Rune Sword — final presentation render" loading="lazy">
        </button>
      </figure>
      <figure class="gallery-item" data-od-id="gallery-item-3">
        <button class="gallery-img-btn" type="button" data-lightbox data-src="assets/rune-sword/rune-sword-03.jpg" aria-label="Open Rune Sword render 3">
          <img src="assets/rune-sword/rune-sword-03.jpg" alt="Rune Sword — detail render" loading="lazy">
        </button>
      </figure>
      <figure class="gallery-item" data-od-id="gallery-item-4">
        <button class="gallery-img-btn" type="button" data-lightbox data-src="assets/rune-sword/rune-sword-04.jpg" aria-label="Open Rune Sword render 4">
          <img src="assets/rune-sword/rune-sword-04.jpg" alt="Rune Sword — detail render" loading="lazy">
        </button>
      </figure>
      <figure class="gallery-item" data-od-id="gallery-item-5">
        <button class="gallery-img-btn" type="button" data-lightbox data-src="assets/rune-sword/rune-sword-05.jpg" aria-label="Open Rune Sword render 5">
          <img src="assets/rune-sword/rune-sword-05.jpg" alt="Rune Sword — detail render" loading="lazy">
        </button>
      </figure>
    </div>

  </div>
</section>

<!-- Footer -->
<footer class="footer" data-od-id="footer" id="contact">
  <div class="container footer-inner">
    <p>© 2026 <strong>MÁRK SZABÓ</strong> · 3D Artist</p>
    <p class="footer-tag">Environment &amp; Hard Surface</p>
  </div>
</footer>

<!-- Lightbox -->
<div class="lightbox" data-od-id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-backdrop" data-close aria-label="Close viewer"></button>
  <div class="lightbox-stage">
    <img class="lightbox-img" alt="Rune Sword render">
  </div>
  <button class="lightbox-btn lightbox-prev" data-prev aria-label="Previous image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lightbox-btn lightbox-next" data-next aria-label="Next image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="lightbox-close" data-close aria-label="Close viewer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <span class="lightbox-count" data-count aria-live="polite">1 / 5</span>
</div>

<script>
var tiles = Array.prototype.slice.call(document.querySelectorAll('[data-lightbox]'));
var lb = document.getElementById('lightbox');
var lbImg = lb.querySelector('.lightbox-img');
var lbCount = lb.querySelector('[data-count]');
var groups = {};
tiles.forEach(function (t) {
  var g = t.closest('[data-gallery]') || document.body;
  var key = g.dataset.gallery || 'all';
  if (!groups[key]) groups[key] = [];
  groups[key].push(t);
  t.galleryKey = key;
});
var current = null;
function openAt(tile) {
  current = tile;
  lbImg.style.opacity = '0';
  lbImg.src = tile.getAttribute('data-src');
  var list = groups[tile.galleryKey];
  lbCount.textContent = (list.indexOf(tile) + 1) + ' / ' + list.length;
  lb.classList.add('is-open');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  lb.classList.remove('is-open');
  document.body.style.overflow = '';
  window.setTimeout(function () {
    if (!lb.classList.contains('is-open')) lbImg.removeAttribute('src');
  }, 260);
}
function step(d) {
  var list = groups[current.galleryKey];
  var i = list.indexOf(current);
  openAt(list[(i + d + list.length) % list.length]);
}
lbImg.addEventListener('load', function () { lbImg.style.opacity = '1'; });
tiles.forEach(function (t) {
  t.addEventListener('click', function () { openAt(t); });
});
lb.querySelectorAll('[data-close]').forEach(function (el) {
  el.addEventListener('click', closeLb);
});
lb.querySelector('[data-prev]').addEventListener('click', function () { step(-1); });
lb.querySelector('[data-next]').addEventListener('click', function () { step(1); });
document.addEventListener('keydown', function (e) {
  if (!lb.classList.contains('is-open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.querySelectorAll('[data-stub]').forEach(function (a) {
  a.addEventListener('click', function (e) { e.preventDefault(); });
});
</script>
</body>
</html>
